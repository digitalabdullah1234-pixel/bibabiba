server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        default_type application/json;
        add_header Retry-After 3600 always;
        return 503 '{"error":"This temporary deployment serves the website only; API features are unavailable."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
